version: "3.9"

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: s4_extensao_dotz-sql-server-local
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=87Wq6gDd4cghsa
    ports:
      - "1433:1433"
    volumes:
      - sql-server-data:/var/opt/mssql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:latest
    container_name: s4_extensao_dotz-rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  sql-server-data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local

networks:
  s4_extensao_dotz_network_dev:
    external: true