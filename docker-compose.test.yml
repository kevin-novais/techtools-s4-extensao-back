services:
  mssql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: s4_extensao_dotz_mssql_test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Test@StrongPwd2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - mssql_test_data:/var/opt/mssql
    networks:
      - s4_extensao_dotz_test_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql_test_data:

networks:
  s4_extensao_dotz_test_network:
    driver: bridge
