# Funcionalidade de sincronização de parceiros/fornecedores do SAP, para manter o cadastro atualizado e evitar erros de integração devido a dados desatualizados. O cron é configurado para rodar no intervalo CRON_SYNC_SAP_PARTNERS, buscando alterações dos últimos DAYS_TO_SYNC_SAP_PARTNERS dias para garantir que nenhuma atualização seja perdida, mesmo que haja falhas temporárias na execução do cron.
CRON_SYNC_SAP_PARTNERS_ENABLED: "true"
CRON_SYNC_SAP_PARTNERS: "*/15 * * * *" # Rodar a cada 15 minutos
DAYS_TO_SYNC_SAP_PARTNERS: "2" # 2 dias
# Funcionalidade de sincronização de registros contábeis, essencial para manter os dados financeiros atualizados e garantir a consistência entre os sistemas. O cron é configurado para rodar no intervalo CRON_SYNC_REGISTROS_CONTABEIS.
CRON_SYNC_REGISTROS_CONTABEIS_ENABLED: "true"
CRON_SYNC_REGISTROS_CONTABEIS: "*/10 * * * *" # cada 10 minutos
SYNC_REGISTROS_CONTABEIS_PAGE_SIZE: "200"

# -- Módulo de integração com Accountfy
# Configuração para acesso de serviços externos á API.
# APP_API_KEY: [secret]

# -- Módulo de integração com VEXPENSES
VEXPENSES_BASE_URL: "https://api.vexpenses.com/v2"
# VEXPENSES_TOKEN_API: [secret]
VEXPENSES_DIAS_PASSADOS: "7"

# Funcionalidade de importação de relatórios aprovados do Vexpenses, para garantir que as despesas sejam processadas e reembolsadas em tempo hábil. O cron é configurado para rodar no intervalo CRON_VEXPENSES_APPROVED_REPORTS, buscando relatórios aprovados nos últimos VEXPENSES_DIAS_PASSADOS dias para garantir que nenhuma despesa aprovada seja perdida, mesmo que haja falhas temporárias na execução do cron.
CRON_VEXPENSES_APPROVED_REPORTS_ENABLED: "true"
CRON_VEXPENSES_APPROVED_REPORTS: "*/15 * * * *" # cada 15 minutos

# Funcionalidade de liquidação de pagamentos do Vexpenses por meio de compensação, para garantir que os pagamentos sejam processados de forma eficiente e que as despesas sejam reembolsadas em tempo hábil. O cron é configurado para rodar no intervalo CRON_VEXPENSES_PAYMENT_BY_CLEARING, buscando despesas aprovadas nos últimos VEXPENSES_DIAS_PASSADOS dias para garantir que nenhuma despesa aprovada seja perdida, mesmo que haja falhas temporárias na execução do cron.
CRON_VEXPENSES_PAYMENT_BY_CLEARING_ENABLED: "true"
CRON_VEXPENSES_PAYMENT_BY_CLEARING: "*/15 * * * *" # cada 15 minutos

# -- Módulo de integração com BANKPLUS/INVENT
BANKPLUS_INVENT_BASE_URL: "https://bankplus-cobranca-stg.invent.app.br"
BANKPLUS_INVENT_USERNAME: "tj51b42z672k2iv6l35o59olcc"
# BANKPLUS_INVENT_PASSWORD: [secret]                           # Senha de autenticação BankPlus
BANKPLUS_INVENT_APLICACAO: "8.BankPlus.Cobranca"           # Identificador da aplicação dentro do BankPlus
BANKPLUS_INVENT_TENANT_ID: "DOTZ"                          # Tenant/empresa no BankPlus

# XTPG
XTPG_SAIDA_API_BASE_URL: "https://apih.deepxrtbr.com.br"
XTPG_SAIDA_API_ENDPOINT: "/dotz/SOAP_API/ITF/Saida.asmx"
XTPG_SAIDA_STATUS_BUSCA: "I"
XTPG_SAIDA_STATUS_SUCESSO: "C"
XTPG_SAIDA_STATUS_ERRO: "E"
CRON_XTPG_SAIDA: "0 */5 * * *"
CRON_XTPG_SAIDA_ENABLED: "true"
XTPG_SAIDA_ENVIO_SAP_HABILITADO: "true"

## -- Módulo de integração Analyzer vendas
# Funcionalidade de processamento de vendas pendentes, para garantir que as vendas sejam processadas e finalizadas em tempo hábil. O cron é configurado para rodar no intervalo CRON_PROCESS_VENDAS_PENDENTES, buscando vendas pendentes nos últimos DAYS_TO_PROCESS_VENDAS_PENDENTES dias para garantir que nenhuma venda pendente seja perdida, mesmo que haja falhas temporárias na execução do cron.
CRON_PROCESS_VENDAS_PENDENTES_ENABLED: "true"
CRON_PROCESS_VENDAS_PENDENTES: "*/30 * * * *" # cada 30 minutos
CRON_PROCESS_VENDAS_INTEGRACAO_ANALIZER_ENABLED: "true"
CRON_PROCESS_VENDAS_INTEGRACAO_ANALIZER: "*/30 * * * *" # cada 30 minutos
CRON_PROCESS_VENDAS_INTEGRACAO_ANALIZER_BATCH_SIZE: "100"

CRON_PROCESS_VENDA_REC_DIFERIDA_PENDENTES_ENABLED: "true"
CRON_PROCESS_VENDA_REC_DIFERIDA_PENDENTES: "0 * * * *" # cada hora

CRON_PROCESS_VENDA_REC_DIFERIDA_REVERSAO_ENABLED: "true"
CRON_PROCESS_VENDA_REC_DIFERIDA_REVERSAO: "3 */3 * * *"

CRON_DETECT_VENDA_REC_DIFERIDA_REVERSAO_SAP_ENABLED: "true"
CRON_DETECT_VENDA_REC_DIFERIDA_REVERSAO_SAP: "15 */3 * * *" # 15min após o sync de registros contábeis

# Detecta no SAP o cancelamento (JE de reversão) da NF de um romaneio de troca: cancela o romaneio
# e reabre os pedidos no Analyzer, para que possam ser vinculados a um novo romaneio/NF.
CRON_DETECT_TROCA_REVERSAO_SAP_ENABLED: "true"
CRON_DETECT_TROCA_REVERSAO_SAP: "20 */3 * * *" # 20min após o sync de registros contábeis

CRON_CONSULTAR_BOLETO_ENABLED: "true"
CRON_CONSULTAR_BOLETO: "*/15 * * * *" # cada 15 minutos

CRON_ENVIAR_VENDAS_EMAIL_ENABLED: "true"
CRON_ENVIAR_VENDAS_EMAIL: "*/15 * * * *" # cada 15 minutos
# Configuração de email para envio de notificações de vendas, para garantir que as partes interessadas sejam informadas sobre o status das vendas e possam tomar as ações necessárias. O email configurado em DOTZ_EMAIL_VENDAS_RECEBER receberá as notificações de vendas, e o cron é configurado para rodar no intervalo CRON_ENVIAR_VENDAS_EMAIL.
DOTZ_EMAIL_CONTAS_RECEBER: "lucas.aroucha@actionsys.com.br"

